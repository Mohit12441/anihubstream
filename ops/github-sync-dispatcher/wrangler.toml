name = "anihubstream-sync-dispatcher"
main = "src/index.mjs"
compatibility_date = "2026-10-17"

# 2-hour cron schedule (12 runs per day, < 18% GitHub Action minutes):
# Fires every 2 hours at :07 UTC (safe from top-of-hour bot traffic)
[triggers]
crons = ["7 */2 * * *"]

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false

