name = "anihubstream-sync-dispatcher"
main = "src/index.mjs"
compatibility_date = "2026-10-17"

# Three separate staggered cron schedules:
# 1. AniList sync: every 30 minutes on :07 and :37
# 2. Kitsu sync: every 30 minutes on :17 and :47
# 3. HiAnime sync: every 30 minutes on :27 and :57
[triggers]
crons = ["7,37 * * * *", "17,47 * * * *", "27,57 * * * *"]

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false

