services:
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: anihub-meilisearch
    ports:
      - "7700:7700"
    environment:
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

volumes:
  meili_data:
