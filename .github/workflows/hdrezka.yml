name: hdrezka-cache

on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:
    inputs:
      ids:
        description: 'comma separated episode or series ids'
        required: false

concurrency: hdrezka

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prefetch Rezka Metadata
        run: node scripts/rezka-auto.mjs
        env:
          IDS: ${{ inputs.ids || vars.HDREZKA_WATCHLIST }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE: ${{ secrets.CF_KV_NAMESPACE }}
