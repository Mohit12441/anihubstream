name: providers-sync

# Multi-Provider & Franchise Synchronization
# Synchronizes:
# 1. AniKoto verified and discovered slugs into anime_provider_mapping & anime_id_map
# 2. AniWatch catalog sitemap mapping into anime_provider_mapping & anime_id_map
# 3. Canonical franchise & chronological relations in anime_franchise_relation
# 4. Normalizes catalog scores to uniform 10-point scale
# Runs every 6 hours and on repository/workflow dispatch.

on:
  schedule:
    - cron: '45 */6 * * *'
  repository_dispatch:
    types: [providers-sync, catalog-sync]
  workflow_dispatch:
    inputs:
      force:
        description: 'Force execution even if lease is held'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: providers-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: log execution metadata
        run: |
          echo "=== GitHub Actions Multi-Provider Sync ==="
          echo "Workflow: ${{ github.workflow }}"
          echo "Event: ${{ github.event_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Cadence: Every 6 hours"
          echo "UTC Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "=========================================="

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19'

      - name: run multi-provider sync
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node cloud-sync/sync-providers.mjs ${{ github.event.inputs.force == 'true' && '--force' || '' }}
