name: Sync Trending Anime News

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-news
  cancel-in-progress: false

jobs:
  sync-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Fetch, Enrich & Match News
        run: node tools/sync-news.mjs

      - name: Commit & Push Updated News Feed & Sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news/feed.json public/api/news.json public/sitemap-news.xml public/feed.xml public/rss.xml
          if ! git diff --staged --quiet; then
            git commit -m "chore(news): auto-sync trending anime news & update sitemap [skip ci]"
            git pull origin master --rebase || true
            git push origin HEAD:master
          fi
