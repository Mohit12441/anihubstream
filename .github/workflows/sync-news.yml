name: Sync Trending Anime News

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-news
  cancel-in-progress: false

jobs:
  sync-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Fetch, Enrich & Match News
        run: node tools/sync-news.mjs

      - name: Commit & Push Updated News Feed & Sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news/feed.json public/api/news.json public/sitemap-news.xml
          git diff --staged --quiet || (git commit -m "chore(news): auto-sync trending anime news & update sitemap [skip ci]" && git push)
