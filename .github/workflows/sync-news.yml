name: Sync Trending Anime News

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-news
  cancel-in-progress: false

jobs:
  sync-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Fetch, Enrich & Match News (IndexNow & Bing Auto-Push)
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY || '0f95f3641de8422999f1ab7d7acf9f53' }}
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}
        run: |
          if [ -n "$GSC_KEY_JSON" ]; then
            echo "$GSC_KEY_JSON" > /tmp/gsc-key.json
            export GSC_KEY_PATH=/tmp/gsc-key.json
          fi
          node tools/sync-news.mjs
          node scripts/generate-sitemap.mjs
          node scripts/generate-rss.mjs
          if [ -f /tmp/gsc-key.json ]; then
            rm -f /tmp/gsc-key.json
          fi

      - name: Commit & Push Updated News Feed & Sitemap
        id: commit_step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news/feed.json public/news-feed.json public/api/news.json public/sitemap-news.xml public/sitemap.xml public/feed.xml public/rss.xml
          if ! git diff --staged --quiet; then
            git commit -m "chore(news): auto-sync trending anime news & update sitemap"
            git pull origin master --rebase || true
            git push origin HEAD:master
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.commit_step.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npm run build:pages
          npx wrangler pages deploy dist-pages --project-name anihubstream --branch master
