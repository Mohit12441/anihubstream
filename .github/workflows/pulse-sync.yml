name: AniHub Automatic Sync

# AniHubStream Automated Synchronization Pipeline (Free-Tier Safe)
#
# Cadence:
#   - Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC): Airing Schedules & Next Episode Countdowns
#   - Daily at 00:00 UTC: Top-50 Trending Rankings + New Anime Discovery & Ingestion
#   - Weekly (Sunday 03:00 UTC): Multi-Provider Mappings & Franchise Graph Rebuild
#
# Free Tier Safety Limits:
#   - GitHub Actions: ~4 runs/day = ~120 runs/month (~50-80 min/mo out of 2,000 min free limit)
#   - Cloudflare D1: ~200-500 rows written/day (out of 100,000 writes/day free limit)
#   - Zero external workers: Triggers natively via GitHub Actions cron

on:
  schedule:
    # Runs every 6 hours at minute 0 (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [pulse, daily, daily-sync, providers, providers-sync, catalog-sync, all]
  workflow_dispatch:
    inputs:
      target:
        description: 'Sync target (pulse, daily, providers, all)'
        required: false
        default: 'pulse'
        type: choice
        options:
          - pulse
          - daily
          - providers
          - all
      limit:
        description: 'New anime discovery limit (for daily/all target)'
        required: false
        default: '3'

permissions:
  contents: write

concurrency:
  group: pulse-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19'

      - name: Execute Sync Pipeline
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          TARGET="${{ github.event.client_payload.target || github.event.inputs.target }}"
          DISCOVERY_LIMIT="${{ github.event.inputs.limit || '3' }}"

          # Handle scheduled triggers based on current UTC time:
          # - Sunday 03:xx UTC -> weekly multi-provider maintenance
          # - Daily 00:xx UTC -> 24-hour trending & new anime discovery
          # - 06:xx, 12:xx, 18:xx UTC -> airing countdowns & schedule pulse
          if [ -z "$TARGET" ]; then
            DOW=$(date -u +%u)
            HOUR=$(date -u +%H)
            if [ "$DOW" = "7" ] && [ "$HOUR" = "03" ]; then
              TARGET="providers"
            elif [ "$HOUR" = "00" ]; then
              TARGET="daily"
            else
              TARGET="pulse"
            fi
          fi

          echo "============================================================"
          echo "AniHubStream Sync Pipeline: Target = $TARGET"
          echo "============================================================"

          if [ "$TARGET" = "providers" ] || [ "$TARGET" = "providers-sync" ]; then
            echo "⚡ [WEEKLY] Synchronizing Multi-Provider Mappings & Franchise Graph..."
            node cloud-sync/sync-providers.mjs --force

          elif [ "$TARGET" = "daily" ] || [ "$TARGET" = "daily-sync" ] || [ "$TARGET" = "catalog-sync" ] || [ "$TARGET" = "all" ]; then
            echo "📅 [24-HOUR DAILY] Syncing Airing Schedules + Global Trending Ranks..."
            node tools/pulse-airing.mjs --remote --trending

            echo "🌱 [24-HOUR DAILY] Ingesting New Seasonal Anime (Limit: $DISCOVERY_LIMIT, Remote D1)..."
            node tools/discover-titles.mjs --limit=$DISCOVERY_LIMIT --remote || true

            echo "⚡ [24-HOUR DAILY] Normalizing Provider Mappings & Ratings..."
            node cloud-sync/sync-providers.mjs --force || true

          else
            echo "⏱️ [6-HOUR PULSE] Syncing AniList Broadcast Schedules & Episode Countdowns..."
            node tools/pulse-airing.mjs --remote
          fi

      - name: Commit newly discovered sources
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain tools/catalogue-sources.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add tools/catalogue-sources.json
            git commit -m "chore(sync): record newly discovered anime [skip ci]"
            git push origin master
            echo "New anime recorded and pushed! Running provider mapping update..."
            node cloud-sync/sync-providers.mjs --force || true
          fi

      - name: Notify search engines (IndexNow & Google)
        if: github.event.client_payload.target != 'pulse' && github.event.inputs.target != 'pulse'
        env:
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}
        run: |
          echo "📡 Notifying search engines via IndexNow..."
          node tools/indexnow.mjs --sitemap || true
          if [ -n "$GSC_KEY_JSON" ]; then
            echo "🔍 Submitting sitemap to Google Search Console..."
            echo "$GSC_KEY_JSON" > /tmp/gsc-key.json
            GSC_KEY_PATH=/tmp/gsc-key.json node tools/gsc-telemetry.mjs --submit-sitemap || true
            rm -f /tmp/gsc-key.json
          fi
