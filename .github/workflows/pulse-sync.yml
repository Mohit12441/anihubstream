name: pulse-sync

# 3-Tier Multi-Provider Synchronization:
#   1. Hourly (1h): AniList Airing Schedules & Episode Countdowns (target: pulse)
#   2. Daily (24h): Top-50 Trending Rankings & Catalog Growth (target: daily)
#   3. Weekly (7d): Multi-Provider Mappings & Franchise Graph Rebuild (target: providers)
#
# Triggered by Cloudflare Worker cron dispatcher (ops/github-sync-dispatcher).
# Uses 5s - 35s execution time (< 10% of monthly free GitHub Actions minutes).

on:
  schedule:
    # Hourly backup pulse (fires at :37 past each hour)
    - cron: '37 * * * *'
  repository_dispatch:
    types: [pulse, daily, daily-sync, providers, providers-sync, catalog-sync, all]
  workflow_dispatch:
    inputs:
      target:
        description: 'Sync target (pulse, daily, providers, all)'
        required: false
        default: 'pulse'
        type: choice
        options:
          - pulse
          - daily
          - providers
          - all

permissions:
  contents: write

concurrency:
  group: pulse-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19'

      - name: Execute Sync Pipeline
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          TARGET="${{ github.event.client_payload.target || github.event.inputs.target }}"

          # Handle scheduled backup triggers:
          # - Sunday 03:xx UTC -> weekly providers maintenance
          # - Daily 00:xx UTC -> 24-hour trending & catalog discovery
          # - Otherwise -> hourly AniList broadcast pulse
          if [ -z "$TARGET" ]; then
            DOW=$(date -u +%u)
            HOUR=$(date -u +%H)
            if [ "$DOW" = "7" ] && [ "$HOUR" = "03" ]; then
              TARGET="providers"
            elif [ "$HOUR" = "00" ]; then
              TARGET="daily"
            else
              TARGET="pulse"
            fi
          fi

          echo "============================================================"
          echo "Sync Target: $TARGET"
          echo "============================================================"

          if [ "$TARGET" = "providers" ] || [ "$TARGET" = "providers-sync" ]; then
            echo "⚡ [WEEKLY] Synchronizing Multi-Provider Mappings & Franchise Graph..."
            node cloud-sync/sync-providers.mjs --force

          elif [ "$TARGET" = "daily" ] || [ "$TARGET" = "daily-sync" ] || [ "$TARGET" = "catalog-sync" ] || [ "$TARGET" = "all" ]; then
            echo "📅 [24-HOUR DAILY] Syncing Airing Schedules + Global Trending Ranks..."
            node tools/pulse-airing.mjs --remote --trending

            LIMIT=10
            echo "🌱 [24-HOUR DAILY] Ingesting Catalog Backlog & Discovering Anime (Limit: $LIMIT, Remote D1)..."
            node tools/discover-titles.mjs --limit=$LIMIT --force --remote || true

            echo "⚡ [24-HOUR DAILY] Normalizing Provider Mappings & Ratings..."
            node cloud-sync/sync-providers.mjs --force || true

          else
            echo "⏱️ [HOURLY] Syncing AniList Broadcast Schedules & Episode Countdowns..."
            node tools/pulse-airing.mjs --remote
          fi

      - name: Notify search engines via IndexNow
        if: always()
        run: |
          echo "📡 Notifying search engines via IndexNow..."
          node tools/indexnow.mjs --sitemap || true

      - name: Commit newly discovered sources
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain tools/catalogue-sources.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add tools/catalogue-sources.json
            git commit -m "chore(sync): record discovered anime sources [skip ci]"
            git push origin master
            echo "New anime discovered and committed! Running immediate provider & franchise sync..."
            node cloud-sync/sync-providers.mjs --force || true
          fi
