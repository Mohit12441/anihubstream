name: AniHub Automatic Sync

# AniHubStream Automated Synchronization Pipeline (Free-Tier Safe)
#
# Cadence:
#   - Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC): Airing Schedules & Next Episode Countdowns
#   - Daily at 00:00 UTC: Top-50 Trending Rankings + New Anime Discovery & Ingestion
#   - Weekly (Sunday 03:00 UTC): Multi-Provider Mappings & Franchise Graph Rebuild
#
# Free Tier Safety Limits:
#   - GitHub Actions: ~4 runs/day = ~120 runs/month (~50-80 min/mo out of 2,000 min free limit)
#   - Cloudflare D1: ~200-500 rows written/day (out of 100,000 writes/day free limit)
#   - Zero external workers: Triggers natively via GitHub Actions cron

on:
  schedule:
    # Runs every 4 hours to keep trending ranks and airing schedules constantly fresh
    - cron: '0 */4 * * *'
  repository_dispatch:
    types: [pulse, daily, daily-sync, providers, providers-sync, catalog-sync, all]
  workflow_dispatch:
    inputs:
      target:
        description: 'Sync target (all, pulse, providers, discover)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - pulse
          - discover
          - providers
      limit:
        description: 'New anime discovery limit'
        required: false
        default: '5'

permissions:
  contents: write

concurrency:
  group: pulse-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19'

      - name: Execute Automated Sync Pipeline
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          MODE: 'delta'
          CLOUD_CREATES_ROWS: '1'
          CLOUD_OWNS_SCHEDULE: '1'
          LEGACY_WRITER_ACTIVE: '1'
        run: |
          TARGET="${{ github.event.client_payload.target || github.event.inputs.target || 'all' }}"
          DISCOVERY_LIMIT="${{ github.event.inputs.limit || '5' }}"

          echo "============================================================"
          echo "AniHubStream Automated Sync: Target = $TARGET"
          echo "============================================================"

          # 1. ALWAYS Sync Global Trending Ranks (AniList Top 50) & Airing Schedules (Runs on every cron)
          echo "🔥 [STEP 1] Syncing Global Trending Ranks (AniList Top 50) & Airing Schedules..."
          node tools/pulse-airing.mjs --remote --trending

          # 2. Ingest New Anime to Continuously Grow the Catalogue
          if [ "$TARGET" != "providers" ]; then
            echo "🌱 [STEP 2A] Syncing & Ingesting New Catalog Titles from HiAnime API..."
            node cloud-sync/sync-hianime.mjs || true

            echo "🔍 [STEP 2B] Discovering Trending AniList Releases & Queueing Pending Titles..."
            node cloud-sync/discover.mjs --limit=$DISCOVERY_LIMIT || true

            echo "📦 [STEP 2C] Creating Rows in D1 from Discovery Queue..."
            MODE=delta CLOUD_CREATES_ROWS=1 LEGACY_WRITER_ACTIVE=1 node cloud-sync/sync-anilist.mjs || true
          fi

          # 3. Synchronize Multi-Provider Mappings (AniKoto, HiAnime, AniWatch, HindiFlix, HDRezka)
          if [ "$TARGET" != "pulse" ]; then
            echo "⚡ [STEP 3] Synchronizing Multi-Provider Mappings & Video Sources..."
            node cloud-sync/sync-providers.mjs || true
          fi

          echo "============================================================"
          echo "✅ Sync Pipeline Execution Completed Successfully!"
          echo "============================================================"

      - name: Commit newly discovered sources
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain tools/catalogue-sources.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add tools/catalogue-sources.json
            git commit -m "chore(sync): record newly discovered anime [skip ci]"
            git push origin master
          fi

      - name: Notify search engines (IndexNow & Google)
        env:
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}
        run: |
          echo "📡 Notifying search engines via IndexNow..."
          node tools/indexnow.mjs --sitemap || true
          if [ -n "$GSC_KEY_JSON" ]; then
            echo "🔍 Submitting sitemap to Google Search Console..."
            echo "$GSC_KEY_JSON" > /tmp/gsc-key.json
            GSC_KEY_PATH=/tmp/gsc-key.json node tools/gsc-telemetry.mjs --submit-sitemap || true
            rm -f /tmp/gsc-key.json
          fi
