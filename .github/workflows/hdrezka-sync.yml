name: hdrezka-sync

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'rows per shard'
        required: false
        default: '400'

concurrency:
  group: hdrezka-sync
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3, 4, 5] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/rezka-sync.mjs
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 6
          LIMIT: ${{ inputs.limit || 400 }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
