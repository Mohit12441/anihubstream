name: kitsu-sync

# Offset by fifteen minutes from anilist-sync (which fires on :00 and :30) so the two jobs
# never share a wall-clock minute — the acceptance criterion, and also the practical
# reason: a Kitsu page and an AniList page competing for the same runner's egress adds
# latency to a request whose spacing is the thing keeping us unblocked.
#
# Same double lock as the AniList job: concurrency group here, D1 lease in the script.

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: kitsu-sync
  cancel-in-progress: false

jobs:
  sync:
    # No ref guard: schedules already fire only on the default branch, and this repo's is
    # `master`, so a `main` condition here would have disabled the job silently.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: log execution metadata (R15)
        run: |
          echo "=== GitHub Actions Run Telemetry ==="
          echo "Workflow: ${{ github.workflow }}"
          echo "Event: ${{ github.event_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Attempt: ${{ github.run_attempt }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Scheduled Cadence: Every 30 min (at :17 and :47 UTC)"
          echo "UTC Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "==================================="

      - uses: actions/setup-node@v4
        with:
          # Exact minor, matching ci.yml and anilist-sync.yml — see the note there.
          node-version: '24.19'

      - name: jitter the start (R11)
        # JITTER_WINDOW_S is read by bash here, never by the Node script, so it is documented in
        # this file rather than in the env table in cloud-sync/README.md. 90s, not anilist-sync's
        # 120s, because this job fires on 15,45 — every 30 minutes — and a wider window would let a
        # late start slide into the next tick's own jitter.
        run: |
          offset=$(( RANDOM % ${JITTER_WINDOW_S:-90} ))
          echo "sleeping ${offset}s"
          sleep "$offset"

      - name: sync Kitsu artwork
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # This job writes no sched_* column and creates no row, so it does not use the phase
          # switches — but it imports ANIME_COLUMNS from sync-anilist.mjs (sync-kitsu.mjs:24), and
          # that module resolves the mode at load. Pass the same values anilist-sync passes, so an
          # unparseable switch or an orphaned phase fails both jobs identically instead of only one
          # of them, which is the version of "it worked in Actions" nobody can read.
          MODE: ${{ vars.MODE || 'delta' }}
          LEGACY_WRITER_ACTIVE: ${{ vars.LEGACY_WRITER_ACTIVE || '0' }}
          CLOUD_CREATES_ROWS: ${{ vars.CLOUD_CREATES_ROWS || '1' }}
          CLOUD_OWNS_GENRES: ${{ vars.CLOUD_OWNS_GENRES }}
          CLOUD_OWNS_SCHEDULE: ${{ vars.CLOUD_OWNS_SCHEDULE || '1' }}
          LEGACY_QUIET_MS: ${{ vars.LEGACY_QUIET_MS }}
          KITSU_MIN_INTERVAL_MS: ${{ vars.KITSU_MIN_INTERVAL_MS }}
          KITSU_PAGES_PER_RUN: ${{ vars.KITSU_PAGES_PER_RUN || '6' }}
          KITSU_DAILY_BUDGET: ${{ vars.KITSU_DAILY_BUDGET }}
          MAX_ITEMS_PER_RUN: ${{ vars.MAX_ITEMS_PER_RUN || '10' }}
        run: node cloud-sync/sync-kitsu.mjs
