name: anilist-sync

# Every requirement this job exists to satisfy:
#   R7  runs on a schedule with no local machine;
#   R8  the concurrency group makes it structurally impossible for two runners to overlap
#       (the D1 lease is the second lock, for the case where a different repo or a manual
#       dispatch reaches the same database);
#   R11 the sleep jitters the start off the top of the minute, so a shared GitHub egress
#       IP does not see our traffic land in a synchronised burst with everyone else's;
#   the job never touches secrets in code — everything comes from repo secrets below.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force_takeover:
        description: 'Phase 3 only: override the heartbeat interlock and record the decision in sync_meta (see cloud-sync/README.md)'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: anilist-sync
  cancel-in-progress: false

jobs:
  sync:
    # No ref guard here on purpose: scheduled workflows already run only against the
    # default branch, and a branch-conditioned run would have silently disabled this job
    # forever (this repo's default branch is `master`, not `main`).
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The same exact minor as ci.yml. The sync path itself needs neither node:sqlite nor type
          # stripping — fetch and node:crypto only — but having the job that runs this code on a
          # different Node than the job that tests it is a way to find out about the difference at
          # 03:15, so nothing in .github/workflows resolves 'latest of a major'.
          node-version: '24.19'

      - name: jitter the start (R11)
        # JITTER_WINDOW_S is a shell variable for this step only — it is read by bash, never by
        # the Node script, so it belongs here and not in the cross-script env table in
        # cloud-sync/README.md. Unset means the 120s below; kitsu-sync.yml uses 90 because that
        # job runs twice an hour and a longer window would start colliding with the next one.
        run: |
          offset=$(( RANDOM % ${JITTER_WINDOW_S:-120} ))
          echo "sleeping ${offset}s so this run does not start on the minute boundary"
          sleep "$offset"

      - name: sync AniList
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # The phase switches. Every one of them is '' when the repo Variable is unset, which
          # each script reads as "take the default" — and the default is Phase 1, the only mode
          # that is safe to run beside the Windows task. See the runbook in cloud-sync/README.md
          # for the order to move them in and the one-line rollback for each.
          MODE: ${{ vars.MODE }}
          LEGACY_WRITER_ACTIVE: ${{ vars.LEGACY_WRITER_ACTIVE }}
          CLOUD_CREATES_ROWS: ${{ vars.CLOUD_CREATES_ROWS }}
          CLOUD_OWNS_GENRES: ${{ vars.CLOUD_OWNS_GENRES }}
          # The fill-only safety valve: 1 lets a mirror/delta run fill an air slot on a row the
          # local task has never stamped and whose slot is entirely empty. It never overwrites a
          # populated slot and never clears one, so it does not break the column partition — see
          # cloud-sync/.env.example. Not a phase switch: unset stays 0.
          CLOUD_OWNS_SCHEDULE: ${{ vars.CLOUD_OWNS_SCHEDULE }}
          LEGACY_QUIET_MS: ${{ vars.LEGACY_QUIET_MS }}
          ANILIST_ENDPOINT: ${{ vars.ANILIST_ENDPOINT }}
          ANILIST_MIN_INTERVAL_MS: ${{ vars.ANILIST_MIN_INTERVAL_MS }}
          ANILIST_BATCH_SIZE: ${{ vars.ANILIST_BATCH_SIZE }}
          ANILIST_DAILY_BUDGET: ${{ vars.ANILIST_DAILY_BUDGET }}
          ANILIST_RELAY_PREFIX: ${{ secrets.ANILIST_RELAY_PREFIX }}
          ANILIST_BREAKER_COOLDOWN_MS: ${{ vars.ANILIST_BREAKER_COOLDOWN_MS }}
          ANILIST_TRENDING_PAGE_SIZE: ${{ vars.ANILIST_TRENDING_PAGE_SIZE }}
          ANILIST_REWALK_AFTER_MS: ${{ vars.ANILIST_REWALK_AFTER_MS }}
          MAX_ITEMS_PER_RUN: ${{ vars.MAX_ITEMS_PER_RUN }}
          # Only ever '--force-takeover', and only when the operator ticked the box: it records a
          # takeover decision in sync_meta instead of waiting out the heartbeat window, so the
          # checkbox exists to answer the interlock with evidence, not to bypass it silently.
          SYNC_ARGS: ${{ github.event.inputs.force_takeover == 'true' && '--force-takeover' || '' }}
        run: node cloud-sync/sync-anilist.mjs ${SYNC_ARGS}
