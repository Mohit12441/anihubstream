name: hianime-sync

# HiAnime Automatic Cloud Catalog Sync:
# Walks HiAnime's catalog API, syncs titles & metadata into Cloudflare D1 database,
# merges source_ids with mal/hianime slugs, and preserves distributed locks.

on:
  schedule:
    - cron: '20 */3 * * *'
  repository_dispatch:
    types: [hianime-sync, catalog-sync]
  workflow_dispatch:
    inputs:
      pages:
        description: 'Number of pages to sync in this run (default: 4)'
        required: false
        default: '4'

permissions: {}

concurrency:
  group: hianime-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: log execution metadata
        run: |
          echo "=== GitHub Actions HiAnime Sync Telemetry ==="
          echo "Workflow: ${{ github.workflow }}"
          echo "Event: ${{ github.event_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Scheduled Cadence: Every 3 hours (at :20 UTC)"
          echo "UTC Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "============================================="

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19'

      - name: verify required D1 credentials
        run: |
          missing=()
          [ -z "${{ secrets.CF_ACCOUNT_ID }}" ] && missing+=("CF_ACCOUNT_ID")
          [ -z "${{ secrets.CF_DATABASE_ID }}" ] && missing+=("CF_DATABASE_ID")
          [ -z "${{ secrets.CF_API_TOKEN }}" ] && missing+=("CF_API_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing D1 secrets: ${missing[*]}"
            exit 1
          fi

      - name: run hianime cloud sync
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          HIANIME_PAGES_PER_RUN: ${{ inputs.pages || '4' }}
        run: node cloud-sync/sync-hianime.mjs
