name: health-canary

# Automated Edge API Uptime & Availability Canary
# Monitors live production deployment at https://anihubstream.pages.dev
# Runs every 12 hours to verify:
#   1. Edge routing & Cloudflare Functions health (/api/health)
#   2. Cloudflare D1 database live query resolution (/api/anime?limit=1)
#   3. Daily broadcast schedule airtime resolver (/api/schedule)
#   4. Dynamic SEO XML sitemap generator (/sitemap.xml)

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: health-canary
  cancel-in-progress: true

jobs:
  canary-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe /api/health
        run: |
          echo "Pinging /api/health..."
          STATUS=$(curl -s -o response.json -w "%{http_code}" --max-time 10 https://anihubstream.pages.dev/api/health)
          cat response.json
          echo ""
          if [ "$STATUS" != "200" ]; then
            echo "❌ /api/health failed with HTTP $STATUS"
            exit 1
          fi
          echo "✅ /api/health is healthy (HTTP 200)"

      - name: probe /api/anime (D1 Live Query Resolution)
        run: |
          echo "Pinging /api/anime?limit=1..."
          STATUS=$(curl -s -o anime.json -w "%{http_code}" --max-time 10 "https://anihubstream.pages.dev/api/anime?limit=1")
          if [ "$STATUS" != "200" ]; then
            echo "❌ /api/anime failed with HTTP $STATUS"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("anime.json", "utf8"));
            if (!Array.isArray(data.results) || data.results.length === 0) {
              console.error("❌ Malformed D1 catalog response:", data);
              process.exit(1);
            }
            console.log("✅ D1 Database query active. Total catalog titles:", data.total, "| Sample title:", data.results[0].title);
          '

      - name: probe /api/schedule
        run: |
          echo "Pinging /api/schedule..."
          STATUS=$(curl -s -o schedule.json -w "%{http_code}" --max-time 10 https://anihubstream.pages.dev/api/schedule)
          if [ "$STATUS" != "200" ]; then
            echo "❌ /api/schedule failed with HTTP $STATUS"
            exit 1
          fi
          echo "✅ /api/schedule is healthy (HTTP 200)"

      - name: probe /sitemap.xml (Dynamic SEO Sitemap)
        run: |
          echo "Pinging /sitemap.xml..."
          STATUS=$(curl -s -I -w "%{http_code}" --max-time 10 https://anihubstream.pages.dev/sitemap.xml | head -n 1 | awk '{print $2}')
          if [ "$STATUS" != "200" ]; then
            echo "❌ /sitemap.xml failed with HTTP $STATUS"
            exit 1
          fi
          echo "✅ /sitemap.xml is responding with HTTP 200"
