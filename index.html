<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07070b" />
    <meta
      name="description"
      content="AniHubStream — watch anime free anytime, anywhere. Explore a world beyond limits."
    />
    <link rel="canonical" href="https://anihubstream.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AniHubStream" />
    <meta property="og:title" content="AniHubStream — Watch Anime Free Anytime, Anywhere" />
    <meta
      property="og:description"
      content="AniHubStream — watch anime free anytime, anywhere. Explore a world beyond limits."
    />
    <meta property="og:url" content="https://anihubstream.com/" />
    <meta property="og:image" content="https://anihubstream.com/og.png" />
    <meta property="og:image:width" content="1792" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="AniHubStream wordmark over a dark, ember-lit background" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AniHubStream — Watch Anime Free Anytime, Anywhere" />
    <meta
      name="twitter:description"
      content="AniHubStream — watch anime free anytime, anywhere. Explore a world beyond limits."
    />
    <meta name="twitter:image" content="https://anihubstream.com/og.png" />
    <meta name="twitter:image:alt" content="AniHubStream wordmark over a dark, ember-lit background" />
    <title>AniHubStream — Watch Anime Free Anytime, Anywhere</title>
    <!-- Card art loads from these two CDNs; warm the connections while the bundle boots. -->
    <link rel="preconnect" href="https://media.kitsu.app" />
    <link rel="preconnect" href="https://s4.anilist.co" />
    <link rel="dns-prefetch" href="https://media.kitsu.app" />
    <link rel="dns-prefetch" href="https://s4.anilist.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The hero art is the largest element on first paint; start it with the CSS. -->
    <link rel="preload" as="image" href="/art/hero-demon.jpg" fetchpriority="high" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Serif+JP:wght@500;700&family=Permanent+Marker&family=Bakbak+One&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/emblem.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
